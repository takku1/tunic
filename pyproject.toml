[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tunic-context"
version = "0.1.0"
description = "Source-grounded context graph reference implementation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
typescript = ["tree-sitter>=0.26", "tree-sitter-typescript>=0.23"]
go = ["tree-sitter>=0.26", "tree-sitter-go>=0.25"]
unigraph = ["tree-sitter>=0.26",
            "tree-sitter-java>=0.23", "tree-sitter-kotlin>=1.1",
            "tree-sitter-scala>=0.26", "tree-sitter-c-sharp>=0.23",
            "tree-sitter-c>=0.24", "tree-sitter-cpp>=0.23",
            "tree-sitter-rust>=0.24", "tree-sitter-swift>=0.7",
            "tree-sitter-php>=0.25", "tree-sitter-ruby>=0.23",
            "tree-sitter-julia>=0.23", "tree-sitter-lua>=0.5",
            "tree-sitter-bash>=0.25", "tree-sitter-powershell>=0.26"]
config = ["pyyaml>=6"]

[project.scripts]
tunic = "tunic.__main__:main"

[tool.setuptools.packages.find]
include = ["tunic*"]
