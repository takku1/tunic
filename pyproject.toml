[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tunic-context"
version = "0.1.0"
description = "Source-grounded context graph reference implementation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
typescript = ["tree-sitter>=0.26", "tree-sitter-typescript>=0.23"]
go = ["tree-sitter>=0.26", "tree-sitter-go>=0.25"]

[project.scripts]
tunic = "tunic.__main__:main"

[tool.setuptools.packages.find]
include = ["tunic*"]
